<!DOCTYPE html>
<html>
<head><title>Review Queue - ClinicCare-Lite</title></head>
<body>
    <h1>Pending Tasks</h1>
    <ul>
    {% for task in tasks %}
        <li>
            Task #{{ task.task_id }} — {{ task.description }} — Category: {{ task.category }}
            <form method="POST" action="{{ url_for('update_task_category', task_id=task.task_id) }}">
                <select name="category">
                    <option value="pending">Pending</option>
                    <option value="in_review">In Review</option>
                    <option value="resolved">Resolved</option>
                    <option value="flagged_urgent">Flagged Urgent</option>
                </select>
                <button type="submit">Update</button>
            </form>
        </li>
    {% endfor %}
    </ul>
</body>
</html>
