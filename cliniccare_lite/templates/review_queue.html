<!DOCTYPE html>
<html>
<head>
    <title>Review Queue - ClinicCare-Lite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
</head>
<body>
    <div class="theme-picker">
        <div class="theme-dot" style="background:#003f7d" onclick="setTheme('default')"></div>
        <div class="theme-dot" style="background:#1c2b4a" onclick="setTheme('black-blue')"></div>
        <div class="theme-dot" style="background:#dc2626" onclick="setTheme('white-red')"></div>
    </div>
    <div class="container">
        <h1>Pending Tasks</h1>
        <ul>
        {% for task in tasks %}
            <li>
                Task #{{ task.task_id }} — {{ task.description }} — Category: {{ task.category }}
                <form method="POST" action="{{ url_for('update_task_category', task_id=task.task_id) }}">
                    <select name="category">
                        <option value="pending">Pending</option>
                        <option value="in_review">In Review</option>
                        <option value="resolved">Resolved</option>
                        <option value="flagged_urgent">Flagged Urgent</option>
                    </select>
                    <button type="submit">Update</button>
                </form>
            </li>
        {% endfor %}
        </ul>
    </div>
    <footer>ClinicCare-Lite — Group 3 C'29</footer>
</body>
</html>
