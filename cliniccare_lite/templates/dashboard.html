<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - ClinicCare-Lite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
</head>
<body>
    <div class="theme-picker">
        <div class="theme-dot" style="background:#003f7d" onclick="setTheme('default')"></div>
        <div class="theme-dot" style="background:#1c2b4a" onclick="setTheme('black-blue')"></div>
        <div class="theme-dot" style="background:#dc2626" onclick="setTheme('white-red')"></div>
    </div>
    <div class="container">
        <h1>Welcome, {{ name }}</h1>
        <span class="role-badge">{{ role }}</span>
        <p>Patient ID: {{ id_number }} — Ashesi ClinicCare-Lite Health Center</p>

        <h2>Quick Actions</h2>
        <p><a href="{{ url_for('submit_task') }}">Submit a Request</a></p>
        <p><a href="{{ url_for('upload_file') }}">Upload a Document</a></p>
        <p><a href="{{ url_for('view_messages') }}">Messages</a></p>

        {% if role == 'clinician' %}
        <p><a href="{{ url_for('review_queue') }}">Review Queue</a></p>
        <p><a href="{{ url_for('analytics_dashboard') }}">Analytics</a></p>
        {% endif %}

        <br>
        <a class="logout" href="{{ url_for('logout') }}">Log out</a>
    </div>
    <footer>ClinicCare-Lite — Group 3 C'29</footer>
</body>
</html>
